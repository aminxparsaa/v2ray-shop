version: '3.8'

services:
  v2ray-shop:
    build: .
    container_name: v2ray-shop
    ports:
      - "5000:5000"
    volumes:
      - .:/app
      - ./instance:/app/instance
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000"]
      interval: 30s
      timeout: 10s
      retries: 3
